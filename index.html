    <!-- <link href="https://fonts.googleapis.com/css2?family=Margarine&display=swap" rel="stylesheet"> -->
</head>

<body>
    <header class="header">
        <div class="left">
            <img src="img/gymlogo2.jpeg" alt="Gym Logo">
            <div>
                <h4>D Fitness</h4>
            </div>
        </div>

        <div class="mid">
            <ul class="navbar">
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="fitness.html">Fitness Calculator</a></li>
                <li><a href="#registrationform">Contact Us</a></li>
                <li><a href="#">About Us</a></li>
            </ul>
        </div>

        <div class="right">
            <button class="btn">Membership</button>
            <button class="btn">Call Us</button>
        </div>
    </header>

    <section class="hero">
        <h1>You don't have to be great to start, but you have to start to be great.</h1>
        <a href="#registrationform"><button class="btn">Register</button></a>
    </section>

    <div class="container" id="registrationform">
        <h1>Join D Fitness Today</h1>
        <form action="noaction.php" method="POST">
            <div class="form-group">
                Name: <br>
                <input type="text" id="name" name="name" placeholder="Enter Your Name" required>
            </div>
            <div class="form-group">
                Age: <br> <input type="number" id="age" name="age" placeholder="Enter Your Age" required>
            </div>
            <div class="form-group">
                Contact Number: <br>
                <input type="tel" id="phone" name="phone" placeholder="Enter Your Number" required>
            </div>
            <div class="form-group">
                Email: <br>
                <input type="email" id="email" name="email" placeholder="Enter Your E-mail" required>
            </div>
            <div class="form-group gender">
                Gender: <br>
                <input type="radio" name="gender" value="Male" required> Male
                <input type="radio" name="gender" value="Female" required> Female
            </div>
            <button type="submit" class="btn">Submit</button>
        </form>
    </div>
</body>
